name: Release

# Tags must look like v1.2.3. v.1.1.1 (a dot after the v) does not match,
# so a mistyped tag cannot open another release.
# Leave the release alone until this workflow finishes. Creating or
# publishing one by hand on the same tag makes a second, empty release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Require a vMAJOR.MINOR.PATCH tag
        run: node scripts/stamp-release-version.mjs "${GITHUB_REF_NAME}" --check

      - name: Stamp the app version from the tag
        run: node scripts/stamp-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Simple Author ${{ github.ref_name }} (beta)'
          releaseBody: 'Beta ${{ github.ref_name }} of Simple Author. Download the installer for your platform below.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
