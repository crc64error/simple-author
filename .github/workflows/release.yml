name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # v1.1.0 is the beta. Older tags stay drafts until someone publishes them.
      - name: Release notes
        id: notes
        run: |
          {
            echo 'body<<END'
            if [ "${{ github.ref_name }}" = "v1.1.0" ]; then
              cat .github/v1.1.0-notes.md
            else
              echo 'Download the installer for your platform below.'
            fi
            echo 'END'
          } >> "$GITHUB_OUTPUT"

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name == 'v1.1.0' && 'Simple Author v1.1.0 (beta)' || format('Simple Author {0}', github.ref_name) }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: ${{ github.ref_name != 'v1.1.0' }}
          prerelease: ${{ github.ref_name == 'v1.1.0' }}
          args: ${{ matrix.args }}
